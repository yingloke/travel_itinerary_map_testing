<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>Shanghai Walking Map · China</title>
<!-- jsDelivr first; unpkg as a fallback if it is blocked. -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css"
      onerror="this.onerror=null;this.href='https://unpkg.com/leaflet@1.9.4/dist/leaflet.css'">
<style>
  :root {
    --glass-bg: rgba(255, 255, 255, 0.74);
    --glass-border: rgba(255, 255, 255, 0.65);
    --glass-shadow: 0 8px 32px rgba(15, 23, 42, 0.18);
    --text: #0f172a;
    --muted: #64748b;
    --chip-bg: rgba(15, 23, 42, 0.06);
    --chip-active-bg: #0f172a;
    --chip-active-text: #ffffff;
    --photo: #2563eb;
    --food: #ea580c;
    --walk: #2563eb;
    --sweet: #db2777;
    --travel: #475569;
    --hotel: #059669;
    --route: #7c3aed;
    --danger: #dc2626;
    --ok: #15803d;
    --focus: #1d4ed8;
    --tb-h: 120px;
    --dr-h: 64px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --glass-bg: rgba(15, 23, 42, 0.72);
      --glass-border: rgba(148, 163, 184, 0.25);
      --glass-shadow: 0 8px 32px rgba(0, 0, 0, 0.45);
      --text: #f1f5f9;
      --muted: #94a3b8;
      --chip-bg: rgba(241, 245, 249, 0.1);
      --chip-active-bg: #f1f5f9;
      --chip-active-text: #0f172a;
      --focus: #93c5fd;
    }
  }
  html, body {
    height: 100dvh; width: 100%; margin: 0; padding: 0; overflow: hidden;
    background: #e5e7eb;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", Roboto, sans-serif;
    color: var(--text);
    -webkit-tap-highlight-color: transparent;
  }
  #map { height: 100dvh; width: 100%; margin: 0; padding: 0; }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

  /* ---------- Glass panels ---------- */
  .glass {
    position: fixed; z-index: 1100;
    background: var(--glass-bg);
    -webkit-backdrop-filter: blur(16px) saturate(170%);
    backdrop-filter: blur(16px) saturate(170%);
    border: 1px solid var(--glass-border);
    box-shadow: var(--glass-shadow);
    border-radius: 18px;
    color: var(--text);
  }
  button { font: inherit; color: inherit; cursor: pointer; }

  #toolbar {
    top: calc(env(safe-area-inset-top, 0px) + 12px);
    left: calc(env(safe-area-inset-left, 0px) + 12px);
    width: 380px; max-width: calc(100vw - 24px);
    padding: 12px 12px 10px;
    box-sizing: border-box;
  }
  .tb-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .brand strong { display: block; font-size: 15px; letter-spacing: -0.01em; }
  .brand span { font-size: 12px; color: var(--muted); }
  .icon-btn {
    border: 0; background: var(--chip-bg); border-radius: 999px;
    width: 34px; height: 34px; display: grid; place-items: center; font-size: 15px;
  }
  #toolbar.collapsed #tbBody { display: none; }
  #toolbar.collapsed #tbToggle { transform: rotate(180deg); }

  .chips {
    display: flex; gap: 6px; overflow-x: auto; padding: 8px 0 2px;
    scrollbar-width: none; -webkit-overflow-scrolling: touch; overscroll-behavior-x: contain;
  }
  /* Fade the trailing edge so a row that scrolls sideways shows there is more. */
  .chips.overflows {
    -webkit-mask-image: linear-gradient(to right, #000 calc(100% - 28px), transparent);
    mask-image: linear-gradient(to right, #000 calc(100% - 28px), transparent);
  }
  .chips::-webkit-scrollbar { display: none; }
  .chips[hidden] { display: none; }
  .chip {
    flex: 0 0 auto; border: 0; background: var(--chip-bg); border-radius: 999px;
    padding: 6px 11px; font-size: 13px; line-height: 1.2; white-space: nowrap;
  }
  .chip small { display: block; font-size: 10px; color: var(--muted); }
  .chip.active { background: var(--chip-active-bg); color: var(--chip-active-text); }
  .chip.active small { color: inherit; opacity: .75; }

  #dayInfo {
    margin-top: 8px; font-size: 12.5px; color: var(--muted);
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
  }
  #dayInfo b { color: var(--text); font-weight: 600; }
  .pill-btn {
    border: 0; border-radius: 999px; padding: 7px 12px; font-size: 12.5px; font-weight: 600;
    background: var(--route); color: #fff; white-space: nowrap;
  }
  .pill-btn.ghost { background: var(--chip-bg); color: var(--text); }
  .pill-btn.danger { background: transparent; color: var(--danger); padding: 7px 8px; }
  .legend { display: flex; gap: 10px; font-size: 11.5px; color: var(--muted); margin-top: 8px; flex-wrap: wrap; }
  .legend i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 4px; vertical-align: -1px; }

  /* ---------- Nearby panel ---------- */
  #drawer {
    bottom: calc(env(safe-area-inset-bottom, 0px) + 12px);
    left: calc(env(safe-area-inset-left, 0px) + 12px);
    width: 380px; max-width: calc(100vw - 24px);
    box-sizing: border-box; padding: 10px 12px;
  }
  .dr-head { display: flex; align-items: center; gap: 8px; }
  #drToggle {
    border: 0; background: none; padding: 4px 0; font-weight: 700; font-size: 14px;
    display: flex; align-items: center; gap: 6px; min-width: 0;
  }
  #drToggle .caret { font-size: 11px; color: var(--muted); }
  #drawer.collapsed #drToggle .caret { transform: rotate(180deg); }
  .badge {
    margin-left: auto; font-size: 12px; font-weight: 600; padding: 5px 9px; border-radius: 999px;
    background: var(--chip-bg); color: var(--muted); white-space: nowrap;
  }
  .badge.ok { background: rgba(14, 165, 233, 0.15); color: #0284c7; }
  .badge.err { background: rgba(220, 38, 38, 0.12); color: var(--danger); }
  .badge.busy { opacity: .7; }
  #locBtn { background: #0ea5e9; }
  #drBody { margin-top: 4px; }
  #drawer.collapsed #drBody { display: none; }
  .note { font-size: 11.5px; color: var(--muted); padding: 2px 0 4px; }
  #nearList { list-style: none; margin: 0; padding: 0; max-height: 34dvh; overflow-y: auto; overscroll-behavior: contain; }
  #nearList li {
    display: flex; align-items: center; gap: 8px; padding: 7px 0;
    border-top: 1px solid var(--chip-bg); font-size: 13px;
  }
  #nearList li:first-child { border-top: 0; }
  .nl-dot {
    flex: 0 0 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-size: 13px;
  }
  .nl-name {
    flex: 1; min-width: 0; cursor: pointer; border: 0; background: none; padding: 0;
    text-align: start; color: inherit; font: inherit;
  }
  .nl-name div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 600; }
  .nl-name small { color: var(--muted); display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .nl-dist { font-size: 12px; font-weight: 700; text-align: right; white-space: nowrap; }
  .nl-dist small { display: block; font-weight: 500; color: var(--muted); }
  .nl-copy { border: 0; background: var(--chip-bg); border-radius: 8px; width: 32px; height: 32px; font-size: 14px; }
  .empty { font-size: 12.5px; color: var(--muted); padding: 6px 0; }

  /* ---------- Live location ---------- */
  .me-wrap { background: none; border: 0; }
  .me-dot {
    width: 16px; height: 16px; margin: 3px; border-radius: 50%; background: #0ea5e9; border: 3px solid #fff;
    box-sizing: border-box; animation: me-pulse 2s infinite;
  }
  @keyframes me-pulse {
    0% { box-shadow: 0 0 0 0 rgba(14, 165, 233, 0.55); }
    70% { box-shadow: 0 0 0 14px rgba(14, 165, 233, 0); }
    100% { box-shadow: 0 0 0 0 rgba(14, 165, 233, 0); }
  }

  /* ---------- Toast ---------- */
  #toast {
    position: fixed; z-index: 1300; left: 50%; transform: translateX(-50%);
    top: calc(env(safe-area-inset-top, 0px) + 16px); max-width: calc(100vw - 32px);
    background: #0f172a; color: #fff; padding: 9px 14px; border-radius: 999px; font-size: 13px;
    box-shadow: 0 6px 20px rgba(0,0,0,.3); opacity: 0; transition: opacity .2s; pointer-events: none;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  #toast.show { opacity: 1; }

  /* ---------- Pins ---------- */
  .pin-wrap { background: none; border: 0; }
  .pin {
    width: 30px; height: 30px; border-radius: 50% 50% 50% 0; transform: rotate(-45deg);
    display: grid; place-items: center; border: 2px solid #fff; box-shadow: 0 3px 8px rgba(0,0,0,.35);
    position: relative;
  }
  .pin span { transform: rotate(45deg); font-size: 14px; line-height: 1; }
  .pin.photo { background: var(--photo); }
  .pin.food { background: var(--food); }
  .pin.walk { background: var(--walk); }
  .pin.sweet { background: var(--sweet); }
  .pin.travel { background: var(--travel); }
  .pin .letter { transform: rotate(45deg); font: 800 14px/1 -apple-system, "Segoe UI", sans-serif; color: #fff; }
  .pin.hotel { background: var(--hotel); }
  /* The pin whose details are open: larger, with a ring, so you can see which one you tapped. */
  .pin.selected { scale: 1.3; box-shadow: 0 0 0 3px #fff, 0 0 0 6px var(--focus), 0 3px 8px rgba(0,0,0,.35); }

  /* ---------- Spot sheet (phones): details slide up from the bottom instead of a popup ---------- */
  /* Height is set from script (--sheet-h) and snaps to small / half / tall; drag the handle to resize. */
  #sheet {
    position: fixed; z-index: 1150; left: 0; right: 0; bottom: 0;
    height: var(--sheet-h, 50dvh);
    display: flex; flex-direction: column; overflow: hidden;
    container: sheet / size;
    background: #ffffff; color: #0f172a;
    border-radius: 20px 20px 0 0; box-shadow: 0 -8px 32px rgba(15, 23, 42, 0.25);
    padding: 0 max(16px, env(safe-area-inset-right, 0px)) 0 max(16px, env(safe-area-inset-left, 0px));
  }
  .sheet-top {
    position: relative; flex: 0 0 auto; display: flex; justify-content: center;
    padding: 10px 0 12px; touch-action: none; cursor: grab;
  }
  #sheet[hidden] { display: none; }
  #sheet.dragging .sheet-top { cursor: grabbing; }
  .sheet-grip { width: 40px; height: 5px; border-radius: 999px; background: #cbd5e1; }
  #sheetClose {
    position: absolute; right: 0; top: 4px; width: 40px; height: 40px; border: 0; border-radius: 999px;
    background: #f1f5f9; color: #0f172a; font-size: 15px;
  }
  #sheetBody {
    flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain;
    padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 16px);
  }
  #sheet .pp h3 { font-size: 17px; padding-right: 48px; }
  #sheet .pp .zh { margin-bottom: 6px; }
  /* One row of small buttons that share the width. */
  #sheet .pp .actions { grid-template-columns: none; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 6px; margin: 4px 0 10px; }
  #sheet .pp .btn { height: 36px; min-height: 0; padding: 0 4px; line-height: 1; font-size: 12px; border-radius: 9px; }
  #sheet .pp .btn.copy:only-of-type { grid-column: auto; }
  /* As the card gets shorter, keep the name and buttons and drop the details. */
  @container sheet (height < 330px) { #sheet .pp .warn, #sheet .pp .row:not(.dist) { display: none; } }
  @container sheet (height < 230px) { #sheet .pp .tags, #sheet .pp .why, #sheet .pp .row { display: none; } }

  /* ---------- Popup ---------- */
  .leaflet-popup-content-wrapper { border-radius: 16px; }
  .leaflet-popup-content { margin: 14px 16px; width: 260px !important; max-width: calc(100vw - 80px); }
  .pp h3 { margin: 0; font-size: 15px; line-height: 1.3; color: #0f172a; }
  .pp .zh { font-size: 15px; color: #334155; margin: 2px 0 8px; font-weight: 600; }
  .pp .tags { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
  .pp .tag { font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 999px; }
  .pp .tag.photo { background: rgba(37, 99, 235, .12); color: var(--photo); }
  .pp .tag.food { background: rgba(234, 88, 12, .12); color: var(--food); }
  .pp .tag.walk { background: rgba(37, 99, 235, .12); color: var(--walk); }
  .pp .tag.sweet { background: rgba(219, 39, 119, .12); color: var(--sweet); }
  .pp .tag.travel { background: #f1f5f9; color: var(--travel); }
  .pp .route { font-size: 12.5px; color: #1e3a8a; background: #eff6ff; border-radius: 8px; padding: 7px 9px; margin-bottom: 8px; }
  .pp .route summary { cursor: pointer; font-weight: 700; }
  .pp .route p { margin: 6px 0 0; line-height: 1.45; color: #1e293b; }
  .pp .tag.hotel { background: rgba(5, 150, 105, .12); color: var(--hotel); }
  .pp .tag.time { background: #f1f5f9; color: #334155; }
  .pp .tag.rn { background: #fee2e2; color: #b91c1c; }
  .pp .zh, .pp .row { -webkit-user-select: text; user-select: text; }
  .pp .why {
    font-size: 13px; line-height: 1.45; color: #1e293b; background: #f8fafc;
    border-left: 3px solid #f59e0b; border-radius: 6px; padding: 7px 9px; margin-bottom: 8px;
  }
  .pp .why b { display: block; font-size: 11px; color: #b45309; letter-spacing: .02em; margin-bottom: 2px; }
  .pp .row { font-size: 12.5px; color: #475569; margin-bottom: 4px; }
  .pp .row.dist { color: #0284c7; font-weight: 600; }
  .pp .warn { font-size: 12px; color: #b45309; background: #fffbeb; border-radius: 8px; padding: 6px 8px; margin: 6px 0 8px; }
  .pp .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 10px; }
  .pp .btn {
    display: block; text-align: center; border: 0; border-radius: 10px; padding: 9px 6px;
    font-size: 12.5px; font-weight: 700; text-decoration: none;
  }
  .pp .btn.copy { background: #f1f5f9; color: #0f172a; }
  .pp .btn.copy:only-of-type { grid-column: span 2; }
  .pp .btn.apple { background: #0f172a; color: #fff !important; }
  .pp .btn.amap { background: #1677ff; color: #fff !important; }

  /* ---------- Leaflet controls under the toolbar on phones ---------- */
  #tbSummary {
    display: none; border: 0; background: none; padding: 0; text-align: start;
    font-size: 12px; color: var(--muted);
  }
  @media (max-width: 640px) {
    #toolbar, #drawer { width: auto; right: calc(env(safe-area-inset-right, 0px) + 10px); left: calc(env(safe-area-inset-left, 0px) + 10px); max-width: none; }
    #toolbar { top: calc(env(safe-area-inset-top, 0px) + 10px); padding: 8px 10px; border-radius: 14px; }
    /* Collapsed: a small pill at top-left that leaves the map and zoom buttons clear. */
    #toolbar.collapsed { right: auto; max-width: calc(100vw - 84px); }
    #toolbar.collapsed .brand span { display: none; }
    #toolbar.collapsed #tbSummary { display: block; }
    .brand strong { font-size: 14px; }
    .icon-btn { width: 30px; height: 30px; flex: 0 0 auto; }
    #drawer { bottom: calc(env(safe-area-inset-bottom, 0px) + 10px); padding: 8px 10px; border-radius: 14px; }
    #drToggle { font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .badge:not(.ok):not(.err):not(.busy) { display: none; }
    #locBtn { padding: 6px 10px; font-size: 12px; }
    #nearList { max-height: 26dvh; }
    .note { display: none; }
    .leaflet-top.leaflet-right { margin-top: calc(var(--tb-h) + 16px); }
    .leaflet-bottom.leaflet-right { margin-bottom: calc(var(--dr-h) + 14px); }
  }

  /* ---------- Touch: 44px tap targets ---------- */
  @media (pointer: coarse) {
    .chip, .pill-btn, #drToggle { min-height: 44px; }
    .icon-btn, .nl-copy { width: 44px; height: 44px; }
    .pp .btn { min-height: 44px; display: grid; place-items: center; }
    #tbSummary { min-height: 32px; }
  }

  /* ---------- Motion, only for people who have not asked for less ---------- */
  @media (prefers-reduced-motion: no-preference) {
    .icon-btn, #drToggle .caret { transition: transform 200ms ease-out; }
    .chip, .pill-btn, .nl-copy, .pp .btn { transition: scale 150ms ease-out; }
    .chip:active, .pill-btn:active, .nl-copy:active, .pp .btn:active { scale: 0.96; }
    .pin { transition: scale 150ms ease-out; }
    #sheet { animation: sheet-in 220ms ease-out both; transition: height 220ms cubic-bezier(0.2, 0, 0, 1); }
    #sheet.dragging { transition: none; }
  }
  @keyframes sheet-in { from { transform: translateY(24px); opacity: 0; } }
</style>
</head>
<body>
<div id="map"></div>

<header id="toolbar" class="glass">
  <div class="tb-head">
    <div class="brand">
      <strong>Shanghai Walking Map · China</strong>
      <span>21–28 Nov 2026 · photo &amp; food itinerary</span>
      <button id="tbSummary" type="button"></button>
    </div>
    <button id="tbToggle" class="icon-btn" type="button" aria-label="Hide filters" aria-expanded="true">▴</button>
  </div>
  <div id="tbBody">
    <div class="chips" id="dayChips" role="group" aria-label="Day"></div>
    <div class="chips" id="catChips" role="group" aria-label="Category"></div>
    <div class="chips" id="routeChips" role="group" aria-label="City walk route"></div>
    <div id="dayInfo"></div>
    <div class="legend">
      <span><i style="background:var(--walk)"></i>Walks</span>
      <span><i style="background:var(--food)"></i>Meals</span>
      <span><i style="background:var(--sweet)"></i>Sweets</span>
      <span><i style="background:var(--hotel)"></i>Hotel</span>
      <span>A–G = city walk routes · pins ±150 m</span>
    </div>
  </div>
</header>

<section id="drawer" class="glass" aria-label="Nearby spots">
  <div class="dr-head">
    <button id="drToggle" aria-expanded="true"><span id="drTitle">Nearest to map centre</span><span class="caret">▾</span></button>
    <span id="badge" class="badge">Location off</span>
    <button id="locBtn" class="pill-btn">📍 Locate me</button>
  </div>
  <div id="drBody">
    <div id="nearNote" class="note"></div>
    <ol id="nearList"></ol>
  </div>
</section>
<section id="sheet" hidden aria-label="Spot details">
  <div class="sheet-top">
    <span class="sheet-grip" aria-hidden="true"></span>
    <button id="sheetClose" type="button" aria-label="Close details">✕</button>
  </div>
  <div id="sheetBody"></div>
</section>
<div id="toast" role="status" aria-live="polite"></div>

<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
<script>window.L || document.write('<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"><\/script>');</script>
<script>
/* =====================================================================
   ITINERARY DATA
   Coordinates: src "wgs" = WGS-84 from OpenStreetMap/Nominatim (exact),
   src "gcj" = GCJ-02 (China map datum, Amap/Apple Maps China) and
   This China version plots everything in GCJ-02 to match the Gaode basemap.
   Apple Maps links use GCJ-02, which is what Apple Maps expects in China.
   ===================================================================== */
const DAYS = [
  { n: 1, date: "Sat 21 Nov", title: "Land at PVG T1 21:30 · hotel · late-night lamb skewers" },
  { n: 2, date: "Sun 22 Nov", title: "Free day · pick a city walk below" },
  { n: 3, date: "Mon 23 Nov", title: "Shanghai Disneyland" },
  { n: 4, date: "Tue 24 Nov", title: "Free day · pick a city walk below" },
  { n: 5, date: "Wed 25 Nov", title: "Free day · pick a city walk below" },
  { n: 6, date: "Thu 26 Nov", title: "Suzhou day trip (outside this map)" },
  { n: 7, date: "Fri 27 Nov", title: "Chill day" },
  { n: 8, date: "Sat 28 Nov", title: "Fly home · PVG T1 at 19:05" }
];

/* City walks from your "City walk route" sheet, in walking order. Stops are listed by id. */
const ROUTES = {
  A: { name: "Ginkgo garden → the Bund", zh: "时空花园 → 外滩",
       how: "Metro L2/10 East Nanjing Rd, exit 7. Walk a few minutes to 时空花园 (Jiangxi Mid Rd × Hankou Rd), Huangpu's first heritage-tree pocket park, with two 100-year-old ginkgos (no. 0367 and 0368) next to Holy Trinity Church. Then head east to the riverside: start at Waibaidu Bridge and walk south past the Bund buildings (lights come on in the evening). If you still have energy, finish with the ¥2 ferry at the Jinling Rd (E) pier. Autumn: ginkgos plus the Bund breeze.",
       stops: ["a-start", "a-garden", "a-church", "waibaidu", "a-bund", "a-ferry"] },
  B: { name: "Bund half-day walk", zh: "北外滩 → 外滩 → 南京路",
       how: "North Bund riverside green → Waibaidu Bridge → the Bund → Nanjing Rd pedestrian street. The post's timing: leave ~15:00, North Bund ~16:00, dinner on Nanjing Rd ~18:00, Bund lights ~19:30, home ~20:30. Tip: for the night view, go straight to Bund viewing-platform entrances 9 or 11 instead of from Nanjing Rd, which is extremely crowded.",
       stops: ["b-northbund", "waibaidu", "b-platform", "b-nanjing"] },
  C: { name: "Wukang Rd – Anfu Rd plane trees", zh: "武康路 – 安福路",
       how: "Metro L10/11 Jiaotong University, exit 7; 3 minutes to Wukang Mansion. Walk north along Wukang Rd past Ferguson Lane, the Romeo Balcony and Ba Jin's former residence, then turn into Anfu Rd (Shanghai Dramatic Arts Centre, lots of small shops). Plane trees are best late Nov – early Dec.",

/* =====================================================================
   GCJ-02 <-> WGS-84 conversion (standard Krasovsky ellipsoid formula)
   ===================================================================== */
const GEO_A = 6378245.0, GEO_EE = 0.00669342162296594323;
function tLat(x, y) {
  let r = -100 + 2 * x + 3 * y + 0.2 * y * y + 0.1 * x * y + 0.2 * Math.sqrt(Math.abs(x));
  r += (20 * Math.sin(6 * x * Math.PI) + 20 * Math.sin(2 * x * Math.PI)) * 2 / 3;
  r += (20 * Math.sin(y * Math.PI) + 40 * Math.sin(y / 3 * Math.PI)) * 2 / 3;
  r += (160 * Math.sin(y / 12 * Math.PI) + 320 * Math.sin(y * Math.PI / 30)) * 2 / 3;
  return r;
}
function tLng(x, y) {
  let r = 300 + x + 2 * y + 0.1 * x * x + 0.1 * x * y + 0.1 * Math.sqrt(Math.abs(x));
  r += (20 * Math.sin(6 * x * Math.PI) + 20 * Math.sin(2 * x * Math.PI)) * 2 / 3;
  r += (20 * Math.sin(x * Math.PI) + 40 * Math.sin(x / 3 * Math.PI)) * 2 / 3;
  r += (150 * Math.sin(x / 12 * Math.PI) + 300 * Math.sin(x / 30 * Math.PI)) * 2 / 3;
  return r;
}
function wgsToGcj(lat, lng) {
  let dLat = tLat(lng - 105, lat - 35), dLng = tLng(lng - 105, lat - 35);
  const radLat = lat / 180 * Math.PI;
  let magic = Math.sin(radLat); magic = 1 - GEO_EE * magic * magic;
  const sqrtMagic = Math.sqrt(magic);
  dLat = (dLat * 180) / ((GEO_A * (1 - GEO_EE)) / (magic * sqrtMagic) * Math.PI);
  dLng = (dLng * 180) / (GEO_A / sqrtMagic * Math.cos(radLat) * Math.PI);
  return { lat: lat + dLat, lng: lng + dLng };
}
function gcjToWgs(lat, lng) {
  let w = { lat, lng };
  for (let i = 0; i < 3; i++) {           // iterate for sub-metre accuracy
    const g = wgsToGcj(w.lat, w.lng);
    w = { lat: w.lat - (g.lat - lat), lng: w.lng - (g.lng - lng) };
  }
  return w;
}

// Short day label for lists: "D3", "D1 & D8" or "Anytime".
function dayShort(s) {

function makeIcon(s) {

    iconSize: [30, 30], iconAnchor: [15, 30], popupAnchor: [0, -30]

function esc(str) {
  return String(str).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function fmtDist(m) {
  return m < 1000 ? `${Math.round(m / 10) * 10} m` : `${(m / 1000).toFixed(1)} km`;
}
// Straight-line distance × 1.3 for street detours, at ~80 m per minute.
function walkMins(m) { return Math.max(1, Math.round(m * 1.3 / 80)); }
function distFrom(ref, s) { return map.distance([ref.lat, ref.lng], [s.pos.lat, s.pos.lng]); }

function popupEl(s) {

    ${d !== null ? `<div class="row dist">📏 ${fmtDist(d)} from you · ~${walkMins(d)} min walk</div>` : ""}
    ${s.addr ? `<div class="row">📍 ${esc(s.addr)}</div>` : ""}
    <div class="row">🚇 ${esc(s.metro)}${s.exit ? " · " + esc(s.exit) : ""}</div>
    <div class="row">🗓️ ${day ? `Day ${day.n} · ${esc(day.date)}` : "Anytime (not scheduled yet)"}${s.alsoDay ? ` and Day ${s.alsoDay}` : ""}</div>

    L.DomEvent.stop(e);

}

/* =====================================================================
   SPOT DETAILS: a bottom sheet on phones, a popup on larger screens
   ===================================================================== */
const isPhone = () => window.matchMedia("(max-width: 640px)").matches;
const reduceMotion = () => window.matchMedia("(prefers-reduced-motion: reduce)").matches;
let selectedId = null;

function markSelected(id) {
  if (selectedId) markers[selectedId].getElement()?.querySelector(".pin")?.classList.remove("selected");
  selectedId = id;
  if (id) markers[id].getElement()?.querySelector(".pin")?.classList.add("selected");
}

function selectSpot(s) {
  const at = L.latLng(s.pos.lat, s.pos.lng);
  if (!isPhone()) {
    map.setView(at, Math.max(map.getZoom(), 16), { animate: !reduceMotion() });
    L.popup({ maxWidth: 300, offset: L.point(0, -24), autoPanPadding: L.point(24, 24) })
      .setLatLng(at).setContent(popupEl(s)).openOn(map);
    return;
  }
  setToolbar(false);
  document.getElementById("drawer").hidden = true;
  const sheet = document.getElementById("sheet");
  document.getElementById("sheetBody").replaceChildren(popupEl(s));
  document.getElementById("sheetBody").scrollTop = 0;
  sheet.hidden = false;
  if (!sheetSize) setSheetSize("half");   // keep the size the user last chose
  markSelected(s.id);
  // One smooth move: put the pin in the middle of the map area left above the sheet.
  const zoom = Math.max(map.getZoom(), 15);
  const target = map.unproject(map.project(at, zoom).add([0, sheetHeights()[sheetSize] / 2]), zoom);
  map.setView(target, zoom, { animate: !reduceMotion(), duration: 0.35 });
}

function closeSheet() {
  const sheet = document.getElementById("sheet");
  if (sheet.hidden) return false;
  sheet.hidden = true;
  sheetSize = null;
  document.getElementById("drawer").hidden = false;
  markSelected(null);
  return true;
}

/* ---------- Resizable sheet: drag the handle; it snaps to small, half or tall ---------- */
const SIZES = ["small", "half", "tall"];
let sheetSize = null;
function sheetHeights() {
  const vh = window.innerHeight;
  return { small: 170, half: Math.round(vh * 0.5), tall: Math.round(vh * 0.88) };
}
function setSheetSize(size) {
  sheetSize = size;
  const sheet = document.getElementById("sheet");
  sheet.classList.remove("dragging");
  sheet.style.setProperty("--sheet-h", sheetHeights()[size] + "px");
  keepPinVisible(sheetHeights()[size]);
}
// After a resize, slide the map only if the chosen pin would end up under the card.
function keepPinVisible(sheetH) {
  if (!selectedId) return;
  const p = map.latLngToContainerPoint(markers[selectedId].getLatLng());
  const visibleH = map.getSize().y - sheetH;
  if (p.y > visibleH * 0.75 || p.y < visibleH * 0.25) map.panBy([0, p.y - visibleH / 2], { animate: !reduceMotion() });
}

document.getElementById("sheetClose").addEventListener("click", closeSheet);
(() => {
  const sheet = document.getElementById("sheet");
  const handle = sheet.querySelector(".sheet-top");
  let startY = null, startH = 0, moved = false;
  handle.addEventListener("pointerdown", e => {
    if (e.target.closest("#sheetClose")) return;
    startY = e.clientY; startH = sheet.offsetHeight; moved = false;
    handle.setPointerCapture(e.pointerId);
    sheet.classList.add("dragging");
  });
  handle.addEventListener("pointermove", e => {
    if (startY === null) return;
    const dy = e.clientY - startY;
    if (Math.abs(dy) > 4) moved = true;
    const h = Math.min(sheetHeights().tall, Math.max(90, startH - dy));
    sheet.style.setProperty("--sheet-h", h + "px");
  });
  const finish = () => {
    if (startY === null) return;
    startY = null;
    const h = sheet.offsetHeight, H = sheetHeights();
    if (!moved) { setSheetSize(SIZES[(SIZES.indexOf(sheetSize) + 1) % SIZES.length]); return; }  // tap cycles sizes
    if (h < H.small - 50) { sheet.classList.remove("dragging"); closeSheet(); return; }          // dragged right down: close
    const nearest = SIZES.reduce((a, b) => Math.abs(H[b] - h) < Math.abs(H[a] - h) ? b : a);
    setSheetSize(nearest);
  };
  handle.addEventListener("pointerup", finish);
  handle.addEventListener("pointercancel", finish);
  // Keyboard: arrow keys on the handle resize the card.
  handle.tabIndex = 0;
  handle.setAttribute("role", "button");
  handle.setAttribute("aria-label", "Resize details card. Up or down arrow to change size.");
  handle.addEventListener("keydown", e => {
    const i = SIZES.indexOf(sheetSize);
    if (e.key === "ArrowUp" && i < SIZES.length - 1) { e.preventDefault(); setSheetSize(SIZES[i + 1]); }
    if (e.key === "ArrowDown") { e.preventDefault(); i > 0 ? setSheetSize(SIZES[i - 1]) : closeSheet(); }
  });
  window.addEventListener("resize", () => { if (sheetSize) setSheetSize(sheetSize); });
})();

/* =====================================================================
   FILTERS
   ===================================================================== */
function isVisible(s) {
  if (s.cat === "hotel") return true;
  const dayOk = state.day === "all" || s.day === state.day || s.alsoDay === state.day;
  const catOk = state.cat === "all" || s.cat === state.cat;
  const routeOk = state.cat !== "walk" || state.route === "all" || (s.routes || []).some(r => r.letter === state.route);
  return dayOk && catOk && routeOk;
}

/* Dashed lines joining each city walk's stops in order (drawn locally, no routing service). */
const routeLines = {};
Object.entries(ROUTES).forEach(([letter, r]) => {
  const pts = r.stops.map(id => { const p = byId[id].pos || byId[id].wgs; return [p.lat, p.lng]; });
  routeLines[letter] = L.polyline(pts, { color: "#2563eb", weight: 3, opacity: 0.75, dashArray: "6 8", interactive: false });
});
function updateRouteLines() {
  Object.entries(routeLines).forEach(([letter, line]) => {
    const show = (state.cat === "all" || state.cat === "walk") &&
      (state.route === "all" || state.route === letter || state.cat !== "walk") &&
      ROUTES[letter].stops.some(id => isVisible(byId[id]));
    if (show && !map.hasLayer(line)) line.addTo(map);
    if (!show && map.hasLayer(line)) map.removeLayer(line);
  });
}

function applyFilters(fit) {
  // Add/remove only what changed so an open popup is not closed.
  const shown = [];
  ALL.forEach(s => {
    const m = markers[s.id];
    if (isVisible(s)) {
      if (!markerLayer.hasLayer(m)) markerLayer.addLayer(m);
      if (s.cat !== "hotel") shown.push(s);
    } else if (markerLayer.hasLayer(m)) {
      markerLayer.removeLayer(m);
    }
  });
  renderChips();
  renderDayInfo(shown);
  updateRouteLines();
  if (fit) fitTo(shown.filter(s => state.day !== "all" || !s.far));
  renderNearby();
}

function fitTo(list) {
  if (!list.length) return;
  const b = L.latLngBounds(list.map(s => [s.pos.lat, s.pos.lng]));
  const tb = document.getElementById("toolbar").getBoundingClientRect();
  const dr = document.getElementById("drawer").getBoundingClientRect();
  const wide = window.innerWidth > 640;
  map.fitBounds(b, {
    paddingTopLeft: [wide ? tb.right + 16 : 24, wide ? 24 : tb.bottom + 16],
    paddingBottomRight: [24, wide ? 24 : window.innerHeight - dr.top + 16],
    maxZoom: 16
  });
}

function renderChips() {
  const dayWrap = document.getElementById("dayChips");
  dayWrap.innerHTML = "";
  [{ key: "all", label: "All Days", sub: "21–28 Nov" }]
    .concat(DAYS.map(d => ({ key: d.n, label: `Day ${d.n}`, sub: d.date })), [{ key: 0, label: "Anytime", sub: "not scheduled" }])
    .forEach(o => {
      const b = document.createElement("button");
      b.className = "chip" + (state.day === o.key ? " active" : "");
      b.type = "button";
      b.setAttribute("aria-pressed", String(state.day === o.key));
      b.innerHTML = `${esc(o.label)}<small>${esc(o.sub)}</small>`;
      b.addEventListener("click", () => { state.day = o.key; applyFilters(true); });
      dayWrap.appendChild(b);
    });

  const catWrap = document.getElementById("catChips");
  catWrap.innerHTML = "";
  [{ key: "all", label: "All" }, { key: "walk", label: "🚶 City walks" }, { key: "food", label: "🍜 Meals" }, { key: "sweet", label: "🧋 Sweets" }]
    .forEach(o => {
      const b = document.createElement("button");
      b.className = "chip" + (state.cat === o.key ? " active" : "");
      b.type = "button";
      b.setAttribute("aria-pressed", String(state.cat === o.key));
      b.textContent = o.label;
      b.addEventListener("click", () => { state.cat = o.key; state.route = "all"; applyFilters(true); });
      catWrap.appendChild(b);
    });

  // Route chips appear only when "City walks" is selected.
  const routeWrap = document.getElementById("routeChips");
  routeWrap.innerHTML = "";
  routeWrap.hidden = state.cat !== "walk";
  if (state.cat === "walk") {
    [{ key: "all", label: "All routes" }].concat(Object.entries(ROUTES).map(([k, r]) => ({ key: k, label: `${k} · ${r.name}` })))
      .forEach(o => {
        const b = document.createElement("button");
        b.className = "chip" + (state.route === o.key ? " active" : "");
        b.type = "button";
        b.setAttribute("aria-pressed", String(state.route === o.key));
        b.textContent = o.label;
        b.addEventListener("click", () => { state.route = o.key; applyFilters(true); });
        routeWrap.appendChild(b);
      });
  }
  markOverflowingChips();
}

function renderDayInfo(shown) {
  const box = document.getElementById("dayInfo");
  const dd = DAYS.find(x => x.n === state.day);
  const catLabel = { all: "All spots", walk: "🚶 Walks", food: "🍜 Meals", sweet: "🧋 Sweets" }[state.cat];
  const dayLabel = dd ? `Day ${dd.n} · ${dd.date}` : state.day === 0 ? "Anytime" : "All days";
  const routeLabel = state.cat === "walk" && state.route !== "all" ? ` ${state.route}` : "";
  document.getElementById("tbSummary").textContent = `${dayLabel} · ${catLabel}${routeLabel} ▾`;
  if (state.day === "all") {
    box.innerHTML = `<b>${shown.length} spots</b> · 21–28 Nov · tap a pin for details`;
  } else if (state.day === 0) {
    box.innerHTML = `<b>Not scheduled yet</b> · ${shown.length} spots to fit into your free days`;
  } else {
    box.innerHTML = `<b>${esc(dd.title)}</b> · ${shown.length} spots · ${esc(dd.date)}`;
  }
  if (state.cat === "walk" && state.route !== "all") {
    box.innerHTML += `<br>🚶 ${esc(ROUTES[state.route].how)}`;
  }
}

/* =====================================================================
   NEARBY LIST
   ===================================================================== */
const NEARBY_MAX = 15;
function renderNearby() {
  const ref = state.me || map.getCenter();
  document.getElementById("drTitle").textContent = state.me ? "Nearest to you" : "Nearest to map centre";
  document.getElementById("nearNote").textContent = state.me
    ? "Straight-line distance; walking time is a rough estimate."
    : "Tap 📍 Locate me to sort by where you are.";
  const rows = ALL
    .filter(s => s.cat !== "hotel" && isVisible(s))
    .map(s => ({ s, d: distFrom(ref, s) }))
    .sort((a, b) => a.d - b.d)
    .slice(0, NEARBY_MAX);
  const list = document.getElementById("nearList");
  list.innerHTML = "";
  if (!rows.length) {
    list.innerHTML = '<li class="empty">No spots match the current filters.</li>';
    return;
  }
  rows.forEach(({ s, d }) => {
    const li = document.createElement("li");
    li.innerHTML = `
      <span class="nl-dot" style="background:var(--${s.cat})">${EMOJI[s.cat]}</span>
      <button class="nl-name" type="button"><div>${esc(s.en)}</div><small>${esc(s.zh)} · ${dayShort(s)}${s.routes ? " · Route " + s.routes.map(r => r.letter).join("/") : ""}</small></button>
      <span class="nl-dist">${fmtDist(d)}${state.me ? `<small>~${walkMins(d)} min</small>` : ""}</span>
      <button class="nl-copy" type="button" aria-label="Copy Chinese name">📋</button>`;
    li.querySelector(".nl-name").addEventListener("click", () => selectSpot(s));
    li.querySelector(".nl-copy").addEventListener("click", () => copyText(s.q, "name"));
    list.appendChild(li);
  });
}
map.on("moveend", () => { if (!state.me) renderNearby(); });

/* =====================================================================
   LIVE LOCATION (device GPS is WGS-84; converted to GCJ-02 to match the Gaode basemap)
   ===================================================================== */
let meMarker = null, meCircle = null, watchId = null, centreOnFix = false, lastNearby = 0;

function setBadge(text, kind) {
  const b = document.getElementById("badge");
  b.textContent = text;
  b.className = "badge" + (kind ? " " + kind : "");
}

function locate() {
  if (!("geolocation" in navigator)) {
    setBadge("No GPS", "err");
    toast("This browser can't share your location.");
    return;
  }
  centreOnFix = true;
  if (state.me) {
    map.setView([state.me.lat, state.me.lng], Math.max(map.getZoom(), 16));
    centreOnFix = false;
  }
  if (watchId !== null) return;
  setBadge("Locating…", "busy");
  watchId = navigator.geolocation.watchPosition(onPosition, onPositionError, {
    enableHighAccuracy: true, maximumAge: 15000, timeout: 20000
  });
}

function onPosition(p) {
  const { accuracy } = p.coords;
  const { lat, lng } = wgsToGcj(p.coords.latitude, p.coords.longitude);
  state.me = { lat, lng };
  if (!meMarker) {
    meMarker = L.marker([lat, lng], {
      icon: L.divIcon({ className: "me-wrap", html: '<div class="me-dot"></div>', iconSize: [22, 22], iconAnchor: [11, 11] }),
      zIndexOffset: 1000, interactive: false, keyboard: false
    }).addTo(map);
    meCircle = L.circle([lat, lng], {
      radius: accuracy, color: "#0ea5e9", weight: 1, fillColor: "#0ea5e9", fillOpacity: 0.12, interactive: false
    }).addTo(map);
  } else {
    meMarker.setLatLng([lat, lng]);
    meCircle.setLatLng([lat, lng]).setRadius(accuracy);
  }
  setBadge(`📍 Live ±${Math.round(accuracy)} m`, "ok");
  if (centreOnFix) { centreOnFix = false; map.setView([lat, lng], 16); }
  const now = Date.now();
  if (now - lastNearby > 3000) { lastNearby = now; renderNearby(); }
}

function onPositionError(err) {
  if (err.code === 1) {
    setBadge("Location blocked", "err");
    toast("Location permission denied: allow it for this page in your browser settings.");
    navigator.geolocation.clearWatch(watchId);
    watchId = null;
  } else if (!state.me) {
    setBadge("No GPS fix yet", "err");
  }
}

/* =====================================================================
   COPY + TOAST
   ===================================================================== */
async function copyText(text, label) {
  let ok = false;
  try {
    if (navigator.clipboard && window.isSecureContext) { await navigator.clipboard.writeText(text); ok = true; }
  } catch (e) { /* fall back below */ }
  if (!ok) {
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.setAttribute("readonly", "");
    ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select(); ta.setSelectionRange(0, text.length);
    try { ok = document.execCommand("copy"); } catch (e) {}
    ta.remove();
  }
  toast(ok ? `Copied ${label}: ${text}` : `Copy failed. Long-press to select: ${text}`);
}

let toastTimer = null;
function toast(msg) {
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove("show"), 2400);
}

/* =====================================================================
   UI WIRING
   ===================================================================== */
function setDrawer(open) {
  document.getElementById("drawer").classList.toggle("collapsed", !open);
  document.getElementById("drToggle").setAttribute("aria-expanded", String(open));
}
document.getElementById("drToggle").addEventListener("click", () => {
  setDrawer(document.getElementById("drawer").classList.contains("collapsed"));
});
function setToolbar(open) {
  document.getElementById("toolbar").classList.toggle("collapsed", !open);
  const t = document.getElementById("tbToggle");
  t.setAttribute("aria-expanded", String(open));
  t.setAttribute("aria-label", open ? "Hide filters" : "Show filters");
  if (open) markOverflowingChips();
}
// Show the edge fade only on chip rows that actually scroll sideways.
function markOverflowingChips() {
  document.querySelectorAll(".chips").forEach(c => c.classList.toggle("overflows", c.scrollWidth > c.clientWidth + 1));
}
window.addEventListener("resize", markOverflowingChips);
// Escape closes an open popup first, then any open panel.
document.addEventListener("keydown", e => {
  if (e.key !== "Escape") return;
  if (closeSheet()) return;
  if (map.getContainer().querySelector(".leaflet-popup")) return;
  setToolbar(false);
  setDrawer(false);
});
document.getElementById("tbToggle").addEventListener("click", () => {
  setToolbar(document.getElementById("toolbar").classList.contains("collapsed"));
});
// The collapsed pill shows the current filter; tapping it opens the filters.
document.getElementById("tbSummary").addEventListener("click", () => setToolbar(true));
// On phones, tapping the map tucks both panels away so the map is usable.
map.on("click", () => {
  if (window.innerWidth > 640) return;
  if (closeSheet()) return;
  setToolbar(false);
  setDrawer(false);
});
document.getElementById("locBtn").addEventListener("click", locate);

// Keep Leaflet controls clear of the floating panels on phones.
const root = document.documentElement;
const ro = new ResizeObserver(() => {
  root.style.setProperty("--tb-h", document.getElementById("toolbar").offsetHeight + "px");
  root.style.setProperty("--dr-h", document.getElementById("drawer").offsetHeight + "px");
});
ro.observe(document.getElementById("toolbar"));
ro.observe(document.getElementById("drawer"));

// Start with both panels collapsed on small screens so the map is visible.
if (window.innerWidth <= 640) {
  setToolbar(false);
  setDrawer(false);
}

applyFilters(true);
</script>
</body>
