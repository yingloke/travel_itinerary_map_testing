<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>Shanghai Walking Map</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  :root {
    --glass-bg: rgba(255, 255, 255, 0.74);
    --glass-border: rgba(255, 255, 255, 0.65);
    --glass-shadow: 0 8px 32px rgba(15, 23, 42, 0.18);
    --text: #0f172a;
    --muted: #64748b;
    --chip-bg: rgba(15, 23, 42, 0.06);
    --chip-active-bg: #0f172a;
    --chip-active-text: #ffffff;
    --photo: #2563eb;
    --food: #ea580c;
    --hotel: #059669;
    --route: #7c3aed;
    --danger: #dc2626;
    --ok: #15803d;
    --focus: #1d4ed8;
    --tb-h: 120px;
    --dr-h: 64px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --glass-bg: rgba(15, 23, 42, 0.72);
      --glass-border: rgba(148, 163, 184, 0.25);
      --glass-shadow: 0 8px 32px rgba(0, 0, 0, 0.45);
      --text: #f1f5f9;
      --muted: #94a3b8;
      --chip-bg: rgba(241, 245, 249, 0.1);
      --chip-active-bg: #f1f5f9;
      --chip-active-text: #0f172a;
      --focus: #93c5fd;
    }
  }
  html, body {
    height: 100dvh; width: 100%; margin: 0; padding: 0; overflow: hidden;
    background: #e5e7eb;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", Roboto, sans-serif;
    color: var(--text);
    -webkit-tap-highlight-color: transparent;
  }
  #map { height: 100dvh; width: 100%; margin: 0; padding: 0; }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

  /* ---------- Glass panels ---------- */
  .glass {
    position: fixed; z-index: 1100;
    background: var(--glass-bg);
    -webkit-backdrop-filter: blur(16px) saturate(170%);
    backdrop-filter: blur(16px) saturate(170%);
    border: 1px solid var(--glass-border);
    box-shadow: var(--glass-shadow);
    border-radius: 18px;
    color: var(--text);
  }
  button { font: inherit; color: inherit; cursor: pointer; }

  #toolbar {
    top: calc(env(safe-area-inset-top, 0px) + 12px);
    left: calc(env(safe-area-inset-left, 0px) + 12px);
    width: 380px; max-width: calc(100vw - 24px);
    padding: 12px 12px 10px;
    box-sizing: border-box;
  }
  .tb-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .brand strong { display: block; font-size: 15px; letter-spacing: -0.01em; }
  .brand span { font-size: 12px; color: var(--muted); }
  .icon-btn {
    border: 0; background: var(--chip-bg); border-radius: 999px;
    width: 34px; height: 34px; display: grid; place-items: center; font-size: 15px;
  }
  #toolbar.collapsed #tbBody { display: none; }
  #toolbar.collapsed #tbToggle { transform: rotate(180deg); }

  .chips {
    display: flex; gap: 6px; overflow-x: auto; padding: 8px 0 2px;
    scrollbar-width: none; -webkit-overflow-scrolling: touch; overscroll-behavior-x: contain;
  }
  /* Fade the trailing edge so a row that scrolls sideways shows there is more. */
  .chips.overflows {
    -webkit-mask-image: linear-gradient(to right, #000 calc(100% - 28px), transparent);
    mask-image: linear-gradient(to right, #000 calc(100% - 28px), transparent);
  }
  .chips::-webkit-scrollbar { display: none; }
  .chip {
    flex: 0 0 auto; border: 0; background: var(--chip-bg); border-radius: 999px;
    padding: 6px 11px; font-size: 13px; line-height: 1.2; white-space: nowrap;
  }
  .chip small { display: block; font-size: 10px; color: var(--muted); }
  .chip.active { background: var(--chip-active-bg); color: var(--chip-active-text); }
  .chip.active small { color: inherit; opacity: .75; }

  #dayInfo {
    margin-top: 8px; font-size: 12.5px; color: var(--muted);
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
  }
  #dayInfo b { color: var(--text); font-weight: 600; }
  .pill-btn {
    border: 0; border-radius: 999px; padding: 7px 12px; font-size: 12.5px; font-weight: 600;
    background: var(--route); color: #fff; white-space: nowrap;
  }
  .pill-btn.ghost { background: var(--chip-bg); color: var(--text); }
  .pill-btn.danger { background: transparent; color: var(--danger); padding: 7px 8px; }
  .legend { display: flex; gap: 10px; font-size: 11.5px; color: var(--muted); margin-top: 8px; flex-wrap: wrap; }
  .legend i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 4px; vertical-align: -1px; }

  /* ---------- Nearby panel ---------- */
  #drawer {
    bottom: calc(env(safe-area-inset-bottom, 0px) + 12px);
    left: calc(env(safe-area-inset-left, 0px) + 12px);
    width: 380px; max-width: calc(100vw - 24px);
    box-sizing: border-box; padding: 10px 12px;
  }
  .dr-head { display: flex; align-items: center; gap: 8px; }
  #drToggle {
    border: 0; background: none; padding: 4px 0; font-weight: 700; font-size: 14px;
    display: flex; align-items: center; gap: 6px; min-width: 0;
  }
  #drToggle .caret { font-size: 11px; color: var(--muted); }
  #drawer.collapsed #drToggle .caret { transform: rotate(180deg); }
  .badge {
    margin-left: auto; font-size: 12px; font-weight: 600; padding: 5px 9px; border-radius: 999px;
    background: var(--chip-bg); color: var(--muted); white-space: nowrap;
  }
  .badge.ok { background: rgba(14, 165, 233, 0.15); color: #0284c7; }
  .badge.err { background: rgba(220, 38, 38, 0.12); color: var(--danger); }
  .badge.busy { opacity: .7; }
  #locBtn { background: #0ea5e9; }
  #drBody { margin-top: 4px; }
  #drawer.collapsed #drBody { display: none; }
  .note { font-size: 11.5px; color: var(--muted); padding: 2px 0 4px; }
  #nearList { list-style: none; margin: 0; padding: 0; max-height: 34dvh; overflow-y: auto; overscroll-behavior: contain; }
  #nearList li {
    display: flex; align-items: center; gap: 8px; padding: 7px 0;
    border-top: 1px solid var(--chip-bg); font-size: 13px;
  }
  #nearList li:first-child { border-top: 0; }
  .nl-dot {
    flex: 0 0 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-size: 13px;
  }
  .nl-name {
    flex: 1; min-width: 0; cursor: pointer; border: 0; background: none; padding: 0;
    text-align: start; color: inherit; font: inherit;
  }
  .nl-name div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 600; }
  .nl-name small { color: var(--muted); display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .nl-dist { font-size: 12px; font-weight: 700; text-align: right; white-space: nowrap; }
  .nl-dist small { display: block; font-weight: 500; color: var(--muted); }
  .nl-copy { border: 0; background: var(--chip-bg); border-radius: 8px; width: 32px; height: 32px; font-size: 14px; }
  .empty { font-size: 12.5px; color: var(--muted); padding: 6px 0; }

  /* ---------- Live location ---------- */
  .me-wrap { background: none; border: 0; }
  .me-dot {
    width: 16px; height: 16px; margin: 3px; border-radius: 50%; background: #0ea5e9; border: 3px solid #fff;
    box-sizing: border-box; animation: me-pulse 2s infinite;
  }
  @keyframes me-pulse {
    0% { box-shadow: 0 0 0 0 rgba(14, 165, 233, 0.55); }
    70% { box-shadow: 0 0 0 14px rgba(14, 165, 233, 0); }
    100% { box-shadow: 0 0 0 0 rgba(14, 165, 233, 0); }
  }

  /* ---------- Toast ---------- */
  #toast {
    position: fixed; z-index: 1300; left: 50%; transform: translateX(-50%);
    top: calc(env(safe-area-inset-top, 0px) + 16px); max-width: calc(100vw - 32px);
    background: #0f172a; color: #fff; padding: 9px 14px; border-radius: 999px; font-size: 13px;
    box-shadow: 0 6px 20px rgba(0,0,0,.3); opacity: 0; transition: opacity .2s; pointer-events: none;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  #toast.show { opacity: 1; }

  /* ---------- Pins ---------- */
  .pin-wrap { background: none; border: 0; }
  .pin {
    width: 30px; height: 30px; border-radius: 50% 50% 50% 0; transform: rotate(-45deg);
    display: grid; place-items: center; border: 2px solid #fff; box-shadow: 0 3px 8px rgba(0,0,0,.35);
    position: relative;
  }
  .pin span { transform: rotate(45deg); font-size: 14px; line-height: 1; }
  .pin.photo { background: var(--photo); }
  .pin.food { background: var(--food); }
  .pin.hotel { background: var(--hotel); }
  /* The pin whose details are open: larger, with a ring, so you can see which one you tapped. */
  .pin.selected { scale: 1.3; box-shadow: 0 0 0 3px #fff, 0 0 0 6px var(--focus), 0 3px 8px rgba(0,0,0,.35); }

  /* ---------- Spot sheet (phones): details slide up from the bottom instead of a popup ---------- */
  #sheet {
    position: fixed; z-index: 1150; left: 0; right: 0; bottom: 0;
    background: #ffffff; color: #0f172a;
    border-radius: 20px 20px 0 0; box-shadow: 0 -8px 32px rgba(15, 23, 42, 0.25);
    max-height: 58dvh; overflow-y: auto; overscroll-behavior: contain;
    padding: 0 max(16px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 16px) max(16px, env(safe-area-inset-left, 0px));
  }
  .sheet-top {
    position: sticky; top: 0; z-index: 1; background: #ffffff;
    display: flex; justify-content: center; padding: 8px 0 6px;
  }
  .sheet-grip { width: 40px; height: 5px; border-radius: 999px; background: #cbd5e1; }
  #sheetClose {
    position: absolute; right: 0; top: 6px; width: 44px; height: 44px; border: 0; border-radius: 999px;
    background: #f1f5f9; color: #0f172a; font-size: 16px;
  }
  #sheet .pp h3 { font-size: 17px; padding-right: 52px; }

  /* ---------- Popup ---------- */
  .leaflet-popup-content-wrapper { border-radius: 16px; }
  .leaflet-popup-content { margin: 14px 16px; width: 260px !important; max-width: calc(100vw - 80px); }
  .pp h3 { margin: 0; font-size: 15px; line-height: 1.3; color: #0f172a; }
  .pp .zh { font-size: 15px; color: #334155; margin: 2px 0 8px; font-weight: 600; }
  .pp .tags { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
  .pp .tag { font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 999px; }
  .pp .tag.photo { background: rgba(37, 99, 235, .12); color: var(--photo); }
  .pp .tag.food { background: rgba(234, 88, 12, .12); color: var(--food); }
  .pp .tag.hotel { background: rgba(5, 150, 105, .12); color: var(--hotel); }
  .pp .tag.time { background: #f1f5f9; color: #334155; }
  .pp .tag.rn { background: #fee2e2; color: #b91c1c; }
  .pp .zh, .pp .row { -webkit-user-select: text; user-select: text; }
  .pp .why {
    font-size: 13px; line-height: 1.45; color: #1e293b; background: #f8fafc;
    border-left: 3px solid #f59e0b; border-radius: 6px; padding: 7px 9px; margin-bottom: 8px;
  }
  .pp .why b { display: block; font-size: 11px; color: #b45309; letter-spacing: .02em; margin-bottom: 2px; }
  .pp .row { font-size: 12.5px; color: #475569; margin-bottom: 4px; }
  .pp .row.dist { color: #0284c7; font-weight: 600; }
  .pp .warn { font-size: 12px; color: #b45309; background: #fffbeb; border-radius: 8px; padding: 6px 8px; margin: 6px 0 8px; }
  .pp .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 10px; }
  .pp .btn {
    display: block; text-align: center; border: 0; border-radius: 10px; padding: 9px 6px;
    font-size: 12.5px; font-weight: 700; text-decoration: none;
  }
  .pp .btn.copy { background: #f1f5f9; color: #0f172a; }
  .pp .btn.copy:only-of-type { grid-column: span 2; }
  .pp .btn.apple { background: #0f172a; color: #fff !important; }
  .pp .btn.amap { background: #1677ff; color: #fff !important; }

  /* ---------- Leaflet controls under the toolbar on phones ---------- */
  #tbSummary {
    display: none; border: 0; background: none; padding: 0; text-align: start;
    font-size: 12px; color: var(--muted);
  }
  @media (max-width: 640px) {
    #toolbar, #drawer { width: auto; right: calc(env(safe-area-inset-right, 0px) + 10px); left: calc(env(safe-area-inset-left, 0px) + 10px); max-width: none; }
    #toolbar { top: calc(env(safe-area-inset-top, 0px) + 10px); padding: 8px 10px; border-radius: 14px; }
    /* Collapsed: a small pill at top-left that leaves the map and zoom buttons clear. */
    #toolbar.collapsed { right: auto; max-width: calc(100vw - 84px); }
    #toolbar.collapsed .brand span { display: none; }
    #toolbar.collapsed #tbSummary { display: block; }
    .brand strong { font-size: 14px; }
    .icon-btn { width: 30px; height: 30px; flex: 0 0 auto; }
    #drawer { bottom: calc(env(safe-area-inset-bottom, 0px) + 10px); padding: 8px 10px; border-radius: 14px; }
    #drToggle { font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .badge:not(.ok):not(.err):not(.busy) { display: none; }
    #locBtn { padding: 6px 10px; font-size: 12px; }
    #nearList { max-height: 26dvh; }
    .note { display: none; }
    .leaflet-top.leaflet-right { margin-top: calc(var(--tb-h) + 16px); }
    .leaflet-bottom.leaflet-right { margin-bottom: calc(var(--dr-h) + 14px); }
  }

  /* ---------- Touch: 44px tap targets ---------- */
  @media (pointer: coarse) {
    .chip, .pill-btn, #drToggle { min-height: 44px; }
    .icon-btn, .nl-copy { width: 44px; height: 44px; }
    .pp .btn { min-height: 44px; display: grid; place-items: center; }
    #tbSummary { min-height: 32px; }
  }

  /* ---------- Motion, only for people who have not asked for less ---------- */
  @media (prefers-reduced-motion: no-preference) {
    .icon-btn, #drToggle .caret { transition: transform 200ms ease-out; }
    .chip, .pill-btn, .nl-copy, .pp .btn { transition: scale 150ms ease-out; }
    .chip:active, .pill-btn:active, .nl-copy:active, .pp .btn:active { scale: 0.96; }
    .pin { transition: scale 150ms ease-out; }
    #sheet { animation: sheet-in 220ms ease-out both; }
  }
  @keyframes sheet-in { from { transform: translateY(24px); opacity: 0; } }
</style>
</head>
<body>
<div id="map"></div>

<header id="toolbar" class="glass">
  <div class="tb-head">
    <div class="brand">
      <strong>Shanghai Walking Map</strong>
      <span>21–28 Nov 2026 · photo &amp; food itinerary</span>
      <button id="tbSummary" type="button"></button>
    </div>
    <button id="tbToggle" class="icon-btn" type="button" aria-label="Hide filters" aria-expanded="true">▴</button>
  </div>
  <div id="tbBody">
    <div class="chips" id="dayChips" role="group" aria-label="Day"></div>
    <div class="chips" id="catChips" role="group" aria-label="Category"></div>
    <div id="dayInfo"></div>
    <div class="legend">
      <span><i style="background:var(--photo)"></i>Photo</span>
      <span><i style="background:var(--food)"></i>Food</span>
      <span><i style="background:var(--hotel)"></i>Hotel</span>
      <span>📕 = RedNote find · pins ±150 m</span>
    </div>
  </div>
</header>

<section id="drawer" class="glass" aria-label="Nearby spots">
  <div class="dr-head">
    <button id="drToggle" aria-expanded="true"><span id="drTitle">Nearest to map centre</span><span class="caret">▾</span></button>
    <span id="badge" class="badge">Location off</span>
    <button id="locBtn" class="pill-btn">📍 Locate me</button>
  </div>
  <div id="drBody">
    <div id="nearNote" class="note"></div>
    <ol id="nearList"></ol>
  </div>
</section>
<section id="sheet" hidden aria-label="Spot details">
  <div class="sheet-top">
    <span class="sheet-grip" aria-hidden="true"></span>
    <button id="sheetClose" type="button" aria-label="Close details">✕</button>
  </div>
  <div id="sheetBody"></div>
</section>
<div id="toast" role="status" aria-live="polite"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
/* =====================================================================
   ITINERARY DATA
   Coordinates: src "wgs" = WGS-84 from OpenStreetMap/Nominatim (exact),
   src "gcj" = GCJ-02 (China map datum, Amap/Apple Maps China) and
   converted to WGS-84 for the OSM basemap and OSRM routing.
   Apple Maps links use GCJ-02, which is what Apple Maps expects in China.
   ===================================================================== */
const DAYS = [
  { n: 1, date: "Sun 22 Nov", title: "Bund · Old City · Lujiazui sunset" },
  { n: 2, date: "Mon 23 Nov", title: "Western French Concession" },

];

  metro: "Pingliang Rd (L12)",
  lat: 31.2604, lng: 121.5223, src: "wgs",
  warn: "Pin placed at Pingliang Rd station; the hotel is a short walk away on Jiangpu Rd."

const STOPS = [

    en: "Bund Viewing Platform", zh: "外滩观景台", time: "10:30 · Morning light",
    tip: "Morning sun lights the Bund facades. Look down 九江路 (Jiujiang Rd): it points straight at the Pearl Tower, a ready-made leading line.",
    metro: "East Nanjing Rd (L2/10)",

    metro: "East Nanjing Rd (L2/10)",

    lat: 31.2350, lng: 121.5085, src: "gcj" },

/* =====================================================================
   GCJ-02 <-> WGS-84 conversion (standard Krasovsky ellipsoid formula)
   ===================================================================== */
const GEO_A = 6378245.0, GEO_EE = 0.00669342162296594323;
function tLat(x, y) {
  let r = -100 + 2 * x + 3 * y + 0.2 * y * y + 0.1 * x * y + 0.2 * Math.sqrt(Math.abs(x));
  r += (20 * Math.sin(6 * x * Math.PI) + 20 * Math.sin(2 * x * Math.PI)) * 2 / 3;
  r += (20 * Math.sin(y * Math.PI) + 40 * Math.sin(y / 3 * Math.PI)) * 2 / 3;
  r += (160 * Math.sin(y / 12 * Math.PI) + 320 * Math.sin(y * Math.PI / 30)) * 2 / 3;
  return r;
}
function tLng(x, y) {
  let r = 300 + x + 2 * y + 0.1 * x * x + 0.1 * x * y + 0.1 * Math.sqrt(Math.abs(x));
  r += (20 * Math.sin(6 * x * Math.PI) + 20 * Math.sin(2 * x * Math.PI)) * 2 / 3;
  r += (20 * Math.sin(x * Math.PI) + 40 * Math.sin(x / 3 * Math.PI)) * 2 / 3;
  r += (150 * Math.sin(x / 12 * Math.PI) + 300 * Math.sin(x / 30 * Math.PI)) * 2 / 3;
  return r;
}
function wgsToGcj(lat, lng) {
  let dLat = tLat(lng - 105, lat - 35), dLng = tLng(lng - 105, lat - 35);
  const radLat = lat / 180 * Math.PI;
  let magic = Math.sin(radLat); magic = 1 - GEO_EE * magic * magic;
  const sqrtMagic = Math.sqrt(magic);
  dLat = (dLat * 180) / ((GEO_A * (1 - GEO_EE)) / (magic * sqrtMagic) * Math.PI);
  dLng = (dLng * 180) / (GEO_A / sqrtMagic * Math.cos(radLat) * Math.PI);
  return { lat: lat + dLat, lng: lng + dLng };
}
function gcjToWgs(lat, lng) {
  let w = { lat, lng };
  for (let i = 0; i < 3; i++) {           // iterate for sub-metre accuracy
    const g = wgsToGcj(w.lat, w.lng);
    w = { lat: w.lat - (g.lat - lat), lng: w.lng - (g.lng - lng) };
  }
  return w;
}

function esc(str) {
  return String(str).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function fmtDist(m) {
  return m < 1000 ? `${Math.round(m / 10) * 10} m` : `${(m / 1000).toFixed(1)} km`;
}
// Straight-line distance × 1.3 for street detours, at ~80 m per minute.
function walkMins(m) { return Math.max(1, Math.round(m * 1.3 / 80)); }
function distFrom(ref, s) { return map.distance([ref.lat, ref.lng], [s.wgs.lat, s.wgs.lng]); }

/* =====================================================================
   SPOT DETAILS: a bottom sheet on phones, a popup on larger screens
   ===================================================================== */
const isPhone = () => window.matchMedia("(max-width: 640px)").matches;
const reduceMotion = () => window.matchMedia("(prefers-reduced-motion: reduce)").matches;
let selectedId = null;

function markSelected(id) {
  if (selectedId) markers[selectedId].getElement()?.querySelector(".pin")?.classList.remove("selected");
  selectedId = id;
  if (id) markers[id].getElement()?.querySelector(".pin")?.classList.add("selected");
}

function selectSpot(s) {
  const at = L.latLng(s.wgs.lat, s.wgs.lng);
  if (!isPhone()) {
    map.setView(at, Math.max(map.getZoom(), 16), { animate: !reduceMotion() });
    L.popup({ maxWidth: 300, offset: L.point(0, -24), autoPanPadding: L.point(24, 24) })
      .setLatLng(at).setContent(popupEl(s)).openOn(map);
    return;
  }
  setToolbar(false);
  document.getElementById("drawer").hidden = true;
  const sheet = document.getElementById("sheet");
  document.getElementById("sheetBody").replaceChildren(popupEl(s));
  sheet.hidden = false;
  sheet.scrollTop = 0;
  markSelected(s.id);
  // One smooth move: put the pin in the middle of the map area left above the sheet.
  const zoom = Math.max(map.getZoom(), 15);
  const target = map.unproject(map.project(at, zoom).add([0, sheet.offsetHeight / 2]), zoom);
  map.setView(target, zoom, { animate: !reduceMotion(), duration: 0.35 });
}

function closeSheet() {
  const sheet = document.getElementById("sheet");
  if (sheet.hidden) return false;
  sheet.hidden = true;
  document.getElementById("drawer").hidden = false;
  markSelected(null);
  return true;
}

document.getElementById("sheetClose").addEventListener("click", closeSheet);
// Swipe down from the top of the sheet to close it.
(() => {
  const sheet = document.getElementById("sheet");
  let startY = null;
  sheet.addEventListener("touchstart", e => { startY = sheet.scrollTop <= 0 ? e.touches[0].clientY : null; }, { passive: true });
  sheet.addEventListener("touchend", e => {
    if (startY !== null && e.changedTouches[0].clientY - startY > 60) closeSheet();
    startY = null;
  }, { passive: true });
})();

/* =====================================================================
   FILTERS
   ===================================================================== */
function isVisible(s) {
  if (s.cat === "hotel") return true;
  return (state.day === "all" || s.day === state.day) && (state.cat === "all" || s.cat === state.cat);
}

function applyFilters(fit) {
  // Add/remove only what changed so an open popup is not closed.
  const shown = [];
  ALL.forEach(s => {
    const m = markers[s.id];
    if (isVisible(s)) {
      if (!markerLayer.hasLayer(m)) markerLayer.addLayer(m);
      if (s.cat !== "hotel") shown.push(s);
    } else if (markerLayer.hasLayer(m)) {
      markerLayer.removeLayer(m);
    }
  });
  renderChips();
  renderDayInfo(shown);
  if (fit) fitTo(shown.filter(s => state.day !== "all" || s.day !== 3));
  renderNearby();
}

function fitTo(list) {
  if (!list.length) return;
  const b = L.latLngBounds(list.map(s => [s.wgs.lat, s.wgs.lng]));
  const tb = document.getElementById("toolbar").getBoundingClientRect();
  const dr = document.getElementById("drawer").getBoundingClientRect();
  const wide = window.innerWidth > 640;
  map.fitBounds(b, {
    paddingTopLeft: [wide ? tb.right + 16 : 24, wide ? 24 : tb.bottom + 16],
    paddingBottomRight: [24, wide ? 24 : window.innerHeight - dr.top + 16],
    maxZoom: 16
  });
}

const NEARBY_MAX = 15;
function renderNearby() {
  const ref = state.me || map.getCenter();
  document.getElementById("drTitle").textContent = state.me ? "Nearest to you" : "Nearest to map centre";
  document.getElementById("nearNote").textContent = state.me
    ? "Straight-line distance; walking time is a rough estimate."
    : "Tap 📍 Locate me to sort by where you are.";
  const rows = ALL
    .filter(s => s.cat !== "hotel" && isVisible(s))
    .map(s => ({ s, d: distFrom(ref, s) }))
    .sort((a, b) => a.d - b.d)
    .slice(0, NEARBY_MAX);
  const list = document.getElementById("nearList");
  list.innerHTML = "";
  if (!rows.length) {
    list.innerHTML = '<li class="empty">No spots match the current filters.</li>';
    return;
  }
  rows.forEach(({ s, d }) => {
    const li = document.createElement("li");
    li.innerHTML = `
      <span class="nl-dot" style="background:var(--${s.cat})">${EMOJI[s.cat]}</span>
      <button class="nl-name" type="button"><div>${esc(s.en)}</div><small>${esc(s.zh)} · D${s.day}</small></button>

}

/* =====================================================================
   LIVE LOCATION (device GPS is WGS-84, same as the OSM basemap)
   ===================================================================== */
let meMarker = null, meCircle = null, watchId = null, centreOnFix = false, lastNearby = 0;

function setBadge(text, kind) {
  const b = document.getElementById("badge");
  b.textContent = text;
  b.className = "badge" + (kind ? " " + kind : "");
}

function locate() {
  if (!("geolocation" in navigator)) {
    setBadge("No GPS", "err");
    toast("This browser can't share your location.");
    return;
  }
  centreOnFix = true;
  if (state.me) {
    map.setView([state.me.lat, state.me.lng], Math.max(map.getZoom(), 16));
    centreOnFix = false;
  }
  if (watchId !== null) return;
  setBadge("Locating…", "busy");
  watchId = navigator.geolocation.watchPosition(onPosition, onPositionError, {
    enableHighAccuracy: true, maximumAge: 15000, timeout: 20000
  });
}

function onPosition(p) {
  const { latitude: lat, longitude: lng, accuracy } = p.coords;
  state.me = { lat, lng };
  if (!meMarker) {
    meMarker = L.marker([lat, lng], {
      icon: L.divIcon({ className: "me-wrap", html: '<div class="me-dot"></div>', iconSize: [22, 22], iconAnchor: [11, 11] }),
      zIndexOffset: 1000, interactive: false, keyboard: false
    }).addTo(map);
    meCircle = L.circle([lat, lng], {
      radius: accuracy, color: "#0ea5e9", weight: 1, fillColor: "#0ea5e9", fillOpacity: 0.12, interactive: false
    }).addTo(map);
  } else {
    meMarker.setLatLng([lat, lng]);
    meCircle.setLatLng([lat, lng]).setRadius(accuracy);
  }
  setBadge(`📍 Live ±${Math.round(accuracy)} m`, "ok");
  if (centreOnFix) { centreOnFix = false; map.setView([lat, lng], 16); }
  const now = Date.now();
  if (now - lastNearby > 3000) { lastNearby = now; renderNearby(); }
}

function onPositionError(err) {
  if (err.code === 1) {
    setBadge("Location blocked", "err");
    toast("Location permission denied: allow it for this page in your browser settings.");
    navigator.geolocation.clearWatch(watchId);
    watchId = null;
  } else if (!state.me) {
    setBadge("No GPS fix yet", "err");
  }
}

/* =====================================================================
   COPY + TOAST
   ===================================================================== */
async function copyText(text, label) {
  let ok = false;
  try {
    if (navigator.clipboard && window.isSecureContext) { await navigator.clipboard.writeText(text); ok = true; }
  } catch (e) { /* fall back below */ }
  if (!ok) {
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.setAttribute("readonly", "");
    ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select(); ta.setSelectionRange(0, text.length);
    try { ok = document.execCommand("copy"); } catch (e) {}
    ta.remove();
  }
  toast(ok ? `Copied ${label}: ${text}` : `Copy failed. Long-press to select: ${text}`);
}

let toastTimer = null;
function toast(msg) {
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove("show"), 2400);
}

  const t = document.getElementById("tbToggle");
  t.setAttribute("aria-expanded", String(open));
  t.setAttribute("aria-label", open ? "Hide filters" : "Show filters");
  if (open) markOverflowingChips();
}
// Show the edge fade only on chip rows that actually scroll sideways.
function markOverflowingChips() {
  document.querySelectorAll(".chips").forEach(c => c.classList.toggle("overflows", c.scrollWidth > c.clientWidth + 1));
}
window.addEventListener("resize", markOverflowingChips);
// Escape closes an open popup first, then any open panel.
document.addEventListener("keydown", e => {
  if (e.key !== "Escape") return;
  if (closeSheet()) return;
  if (map.getContainer().querySelector(".leaflet-popup")) return;
  setToolbar(false);
  setDrawer(false);
});
document.getElementById("tbToggle").addEventListener("click", () => {
  setToolbar(document.getElementById("toolbar").classList.contains("collapsed"));
});
// The collapsed pill shows the current filter; tapping it opens the filters.
document.getElementById("tbSummary").addEventListener("click", () => setToolbar(true));
// On phones, tapping the map tucks both panels away so the map is usable.
map.on("click", () => {
  if (window.innerWidth > 640) return;
  if (closeSheet()) return;
  setToolbar(false);
  setDrawer(false);
});
document.getElementById("locBtn").addEventListener("click", locate);

// Keep Leaflet controls clear of the floating panels on phones.
const root = document.documentElement;
const ro = new ResizeObserver(() => {
  root.style.setProperty("--tb-h", document.getElementById("toolbar").offsetHeight + "px");
  root.style.setProperty("--dr-h", document.getElementById("drawer").offsetHeight + "px");
});
ro.observe(document.getElementById("toolbar"));
ro.observe(document.getElementById("drawer"));

// Start with both panels collapsed on small screens so the map is visible.
if (window.innerWidth <= 640) {
  setToolbar(false);
  setDrawer(false);
}

applyFilters(true);
</script>
</body>
</html>
